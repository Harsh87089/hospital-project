<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CarePulse Real Browser In-DOM E2E Test Runner</title>
  <style>
    body { font-family: monospace; padding: 16px; background: #0f172a; color: #f8fafc; margin: 0; }
    #test-runner-banner { background: #1e293b; padding: 14px 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 16px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    iframe { width: 100%; height: 700px; border: 2px solid #334155; border-radius: 8px; background: white; }
  </style>
</head>
<body>
  <div id="test-runner-banner">
    <h1 style="margin: 0 0 8px 0; font-size: 1.15rem; color: #38bdf8;">CarePulse Real-Browser In-DOM E2E Test Engine</h1>
    <div id="browser-test-summary" data-status="RUNNING" data-passes="0" data-fails="0">Running in-browser tests against served index.html...</div>
    <div id="status-log" style="margin-top: 10px; font-size: 0.85rem; line-height: 1.6;"></div>
  </div>

  <!-- Real Application Loaded in Iframe (Zero Hand-Written Fixtures) -->
  <iframe id="app-frame" src="../index.html"></iframe>

  <script>
    const logEl = document.getElementById('status-log');
    const summaryEl = document.getElementById('browser-test-summary');
    const iframe = document.getElementById('app-frame');

    let passes = 0;
    let fails = 0;
    const results = [];

    function log(msg, isPass = true) {
      if (isPass) {
        passes++;
        results.push(`[PASS] ${msg}`);
      } else {
        fails++;
        results.push(`[FAIL] ${msg}`);
      }
      logEl.innerHTML = results.map(r => `<div class="${r.startsWith('[PASS]') ? 'pass' : 'fail'}">${r}</div>`).join('');
      summaryEl.setAttribute('data-passes', passes);
      summaryEl.setAttribute('data-fails', fails);
      summaryEl.setAttribute('data-status', fails === 0 ? 'PASSED' : 'FAILED');
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    iframe.onload = async () => {
      try {
        const appWindow = iframe.contentWindow;
        const appDoc = iframe.contentDocument || appWindow.document;

        // Allow application scripts and components to complete initial boot
        for (let i = 0; i < 40; i++) {
          if (appWindow.openEmergencyModal && appWindow.LanguageEngine && appWindow.openBookingLayer) break;
          await sleep(100);
        }
        await sleep(300);

        // ---------------------------------------------------------------------
        // Flow 1: Real Emergency SOS Modal & Disclaimer Test
        // ---------------------------------------------------------------------
        const tile = appDoc.querySelector('.service-hub-tile[data-action="open-emergency-modal"]');
        if (tile) {
          tile.click();
        } else if (typeof appWindow.openEmergencyModal === 'function') {
          appWindow.openEmergencyModal();
        }
        await sleep(250);

        const emergModal = appDoc.getElementById('emergency-modal');
        const isModalActive = emergModal && emergModal.classList.contains('active');
        const hasDialogRole = emergModal && emergModal.getAttribute('role') === 'dialog';
        const hasAriaModal = emergModal && emergModal.getAttribute('aria-modal') === 'true';
        const modalText = emergModal ? (emergModal.innerText || emergModal.textContent) : '';
        const hasDisclaimer = modalText.includes('DEMO DISCLAIMER') && modalText.includes('108') && modalText.includes('112');

        log("Real Emergency SOS modal opens on trigger click with .active class", isModalActive);
        log("Real Emergency SOS modal enforces role='dialog' and aria-modal='true'", hasDialogRole && hasAriaModal);
        log("Real Emergency SOS modal renders prominent demo disclaimer (108/112 warning)", hasDisclaimer);

        // Dismiss modal using real close button
        const closeBtn = emergModal ? emergModal.querySelector('[data-action="close-emergency-modal"], .modal-close-btn') : null;
        if (closeBtn) closeBtn.click();
        await sleep(150);
        const isClosed = emergModal && !emergModal.classList.contains('active');
        log("Real Emergency SOS modal dismisses cleanly on close button click", isClosed);

        // ---------------------------------------------------------------------
        // Flow 2: Real Multi-Lingual Dynamic Language Switcher (Unicode Verifications)
        // ---------------------------------------------------------------------
        const paPill = appDoc.querySelector('.lang-pill-btn[data-lang="pa"]');
        if (paPill) {
          paPill.click();
          await sleep(250);
          // Assert genuine Gurmukhi Unicode block characters [\u0A00-\u0A7F] in rendered DOM
          const navOrTitleText = appDoc.querySelector('[data-i18n="sos_title"], [data-i18n="nav_book"], [data-i18n="hero_btn_book"]').textContent;
          const hasGurmukhi = /[\u0A00-\u0A7F]/.test(navOrTitleText);
          log(`LanguageEngine renders genuine Gurmukhi script on Punjabi switch: "${navOrTitleText.trim()}"`, hasGurmukhi);
        } else {
          log("Punjabi language switch pill found in DOM", false);
        }

        const hiPill = appDoc.querySelector('.lang-pill-btn[data-lang="hi"]');
        if (hiPill) {
          hiPill.click();
          await sleep(250);
          // Assert genuine Devanagari Unicode block characters [\u0900-\u097F] in rendered DOM
          const navOrTitleTextHi = appDoc.querySelector('[data-i18n="sos_title"], [data-i18n="nav_book"], [data-i18n="hero_btn_book"]').textContent;
          const hasDevanagari = /[\u0900-\u097F]/.test(navOrTitleTextHi);
          log(`LanguageEngine renders genuine Devanagari script on Hindi switch: "${navOrTitleTextHi.trim()}"`, hasDevanagari);
        } else {
          log("Hindi language switch pill found in DOM", false);
        }

        const enPill = appDoc.querySelector('.lang-pill-btn[data-lang="en"]');
        if (enPill) {
          enPill.click();
          await sleep(200);
          const enText = appDoc.querySelector('[data-i18n="sos_title"]').textContent;
          const isEnRestored = enText.includes('Emergency') || enText.includes('Trauma');
          log("LanguageEngine restores Latin/English text on English switch", isEnRestored);
        } else {
          log("English language switch pill found in DOM", false);
        }

        // ---------------------------------------------------------------------
        // Flow 3: Real Appointment Booking Submission & App-Generated Token
        // ---------------------------------------------------------------------
        // Clear previous storage entries
        appWindow.localStorage.removeItem('carepulse_appointments');
        appWindow.localStorage.removeItem('carepulse_active_token');

        // Trigger real booking layer modal
        const bookBtn = appDoc.querySelector('#btn-hero-book, [data-action="book-appointment"], [data-i18n="hero_btn_book"]');
        if (bookBtn) {
          bookBtn.click();
        } else if (typeof appWindow.openBookingLayer === 'function') {
          appWindow.openBookingLayer('dr-sharma');
        }
        await sleep(250);

        const bookingLayerModal = appDoc.getElementById('booking-layer-modal');
        const isBookingLayerOpen = bookingLayerModal && bookingLayerModal.classList.contains('active');
        log("Real booking layer modal opened via trigger click", isBookingLayerOpen);

        // Select an active slot (if current day is Sunday/off-duty, advance to next date pill)
        let slot = appDoc.querySelector('[data-action="select-slot"]');
        if (!slot) {
          const datePills = appDoc.querySelectorAll('.date-card-pill');
          for (const pill of datePills) {
            pill.click();
            await sleep(100);
            slot = appDoc.querySelector('[data-action="select-slot"]');
            if (slot) break;
          }
        }
        if (slot) slot.click();
        await sleep(150);

        // Populate real form fields with obviously fake/dummy data
        const nameInput = appDoc.getElementById('layer-patient-name');
        const ageInput = appDoc.getElementById('layer-patient-age');
        const phoneInput = appDoc.getElementById('layer-patient-phone');
        const dpdpConsent = appDoc.getElementById('layer-dpdp-consent');

        if (nameInput) nameInput.value = "Gurpreet Singh";
        if (ageInput) ageInput.value = "32";
        if (phoneInput) phoneInput.value = "9876543210"; // Generic dummy phone
        if (dpdpConsent) dpdpConsent.checked = true;

        // Submit real booking form
        const bookingForm = appDoc.getElementById('layer-booking-form');
        if (bookingForm) {
          bookingForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        }
        await sleep(400);

        // Inspect localStorage written by the application itself
        const storedAppointments = JSON.parse(appWindow.localStorage.getItem('carepulse_appointments') || '[]');
        const appWroteToken = storedAppointments.length > 0 && storedAppointments[0].tokenId && storedAppointments[0].tokenId.startsWith('TK-');
        const correctPatientDetails = storedAppointments.length > 0 && storedAppointments[0].patientName === 'Gurpreet Singh' && storedAppointments[0].patientPhone === '9876543210';

        log("Real application code processed booking and stored verified token in localStorage", appWroteToken && correctPatientDetails);

        // Verify real digital token pass modal opened
        const tokenModal = appDoc.getElementById('token-modal');
        const isTokenModalVisible = tokenModal && (tokenModal.classList.contains('active') || tokenModal.style.display !== 'none');
        const slipText = appDoc.getElementById('token-slip-card') ? appDoc.getElementById('token-slip-card').innerText : '';
        const slipContainsToken = slipText.includes('TK-') || slipText.includes('CarePulse');

        log("Real Digital Token E-Pass modal opened with generated token slip", isTokenModalVisible && slipContainsToken);

        // Finalize summary banner
        summaryEl.innerHTML = `<h2 class="${fails === 0 ? 'pass' : 'fail'}" style="margin:0;">REAL-DOM E2E COMPLETE: ${passes} PASSED, ${fails} FAILED</h2>`;
      } catch (err) {
        log(`Unhandled error during real DOM E2E run: ${err.message}`, false);
        summaryEl.innerHTML = `<h2 class="fail" style="margin:0;">E2E ERROR: ${err.message}</h2>`;
      }
    };
  </script>
</body>
</html>
