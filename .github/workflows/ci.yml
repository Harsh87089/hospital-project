name: CarePulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & CLI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Test Suite (36 Tests)
        run: python -m unittest discover -s tests -v

      - name: Run Overclaims & Honest Demo Guard
        run: python -m unittest tests/test_no_overclaims.py -v

      - name: Run Deep CLI Verification Suite (104 Checks)
        run: python tests/cli_deep_validation.py
